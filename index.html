<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💕 Love Anniversary Window 💕</title>
  <style>
    :root {
      --bg1: #ffdce7;
      --bg2: #ffe7f1;
      --pink: #ff5f8f;
      --pink-dark: #e93d75;
      --pink-soft: #ffb6c8;
      --rose: #ff7aa2;
      --peach: #ffd9e6;
      --text: #4b3d4d;
      --white: #fffdfd;
      --shadow: rgba(235, 78, 122, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: var(--text);
    }

    .bg-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(10px);
      opacity: 0.45;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .orb:nth-child(1) {
      width: 300px;
      height: 300px;
      background: rgba(255, 147, 179, 0.35);
      top: 5%;
      left: 8%;
    }

    .orb:nth-child(2) {
      width: 420px;
      height: 420px;
      background: rgba(255, 202, 219, 0.38);
      right: 8%;
      top: 10%;
      animation-delay: 1.5s;
    }

    .orb:nth-child(3) {
      width: 220px;
      height: 220px;
      background: rgba(255, 130, 167, 0.28);
      bottom: 8%;
      left: 20%;
      animation-delay: 3s;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -25px) scale(1.08); }
    }

    .heart-float {
      position: absolute;
      color: rgba(255, 95, 143, 0.5);
      font-size: 18px;
      user-select: none;
      animation: floatUp 8s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.6) rotate(0deg);
        opacity: 0;
      }
      18% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-15vh) scale(1.4) rotate(360deg);
        opacity: 0;
      }
    }

    .window {
      position: relative;
      width: min(90vw, 420px);
      min-height: 560px;
      background: rgba(255, 255, 255, 0.75);
      border: 3px solid rgba(255, 95, 143, 0.75);
      border-radius: 24px;
      box-shadow: 0 18px 50px var(--shadow), 0 10px 18px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      backdrop-filter: blur(8px);
      z-index: 10;
      animation: windowPopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes windowPopIn {
      0% {
        transform: scale(0.5) rotate(-5deg);
        opacity: 0;
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .title-bar {
      height: 58px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, var(--pink), var(--rose));
      color: white;
      letter-spacing: 3px;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand .mini-heart {
      font-size: 14px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .music-toggle {
      background: rgba(255, 255, 255, 0.3);
      border: none;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .music-toggle:hover {
      background: rgba(255, 255, 255, 0.5);
      transform: scale(1.1);
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 8px rgba(255,255,255,0.7);
    }

    .content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px 30px;
      min-height: 500px;
      text-align: center;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .content.hidden {
      display: none;
    }

    .heart-header {
      font-size: 30px;
      letter-spacing: 8px;
      color: var(--pink);
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(255, 95, 143, 0.18);
      animation: heartBeat 1.2s ease-in-out;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.15); }
      28% { transform: scale(1); }
    }

    .message {
      font-size: clamp(1.1rem, 2vw, 1.7rem);
      font-weight: 800;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 18px;
      animation: fadeInUp 0.8s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message strong {
      color: var(--pink-dark);
    }

    .cat-box {
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255, 203, 219, 0.4));
      border: 2px solid rgba(255, 95, 143, 0.15);
      border-radius: 26px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
      margin: 8px 0 24px;
      position: relative;
    }

    .cat-box::before,
    .cat-box::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: rgba(255, 95, 143, 0.2);
      border-radius: 50%;
      bottom: 18px;
      animation: blink 3s infinite;
    }

    .cat-box::before { left: 22px; }
    .cat-box::after { right: 22px; }

    @keyframes blink {
      0%, 48%, 52%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(0.2) rotate(8deg); opacity: 0.3; }
    }

    .pixel-cat {
      font-size: 86px;
      filter: drop-shadow(0 10px 18px rgba(255, 95, 143, 0.2));
      animation: beat 1.8s infinite ease-in-out;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      20% { transform: scale(1.08); }
      40% { transform: scale(0.98); }
      60% { transform: scale(1.12); }
    }

    .btn-container {
      position: relative;
      width: 100%;
      height: 56px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn {
      padding: 12px 28px;
      border: 2px solid var(--pink);
      border-radius: 14px;
      background: var(--white);
      color: var(--pink-dark);
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(255, 164, 190, 0.8);
      transition: all 0.12s ease;
      user-select: none;
      position: absolute;
    }

    .btn:active {
      transform: translate(3px, 3px);
      box-shadow: 0 2px 0 rgba(255, 164, 190, 0.8);
    }

    #yes-btn {
      left: 54px;
      background: linear-gradient(135deg, #fff, #ffeaf1);
      animation: fadeInUp 0.8s ease 0.2s backwards;
    }

    #no-btn {
      left: 190px;
      background: linear-gradient(135deg, #fff, #fff1f5);
      transition: transform 0.12s ease-out, left 0.12s ease, top 0.12s ease;
      animation: fadeInUp 0.8s ease 0.4s backwards;
    }

    .success-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 18px;
      animation: fadeInUp 0.8s ease;
    }

    .success-emoji {
      font-size: 84px;
      margin-bottom: 8px;
      animation: wobble 2.2s infinite ease-in-out;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-6deg) scale(1.05); }
      50% { transform: rotate(7deg) scale(1.08); }
      75% { transform: rotate(-5deg) scale(1.03); }
    }

    .success-title {
      font-size: clamp(1.4rem, 2vw, 2rem);
      color: var(--pink-dark);
      font-weight: 900;
      margin-bottom: 12px;
    }

    .success-date {
      color: #7f6a76;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .success-message {
      max-width: 300px;
      font-size: 1rem;
      line-height: 1.65;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 18px;
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
      margin-top: 8px;
    }

    .memory-card {
      background: linear-gradient(135deg, #fff, #ffeef5);
      border: 1px solid rgba(255, 95, 143, 0.18);
      border-radius: 14px;
      padding: 12px 8px;
      color: var(--pink-dark);
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(255, 136, 170, 0.12);
      animation: fadeInUp 0.8s ease;
      animation-fill-mode: both;
    }

    .memory-card:nth-child(1) { animation-delay: 0.1s; }
    .memory-card:nth-child(2) { animation-delay: 0.2s; }
    .memory-card:nth-child(3) { animation-delay: 0.3s; }

    .memory-card span {
      display: block;
      font-size: 22px;
      margin-bottom: 6px;
      filter: drop-shadow(0 2px 8px rgba(255, 95, 143, 0.15));
    }

    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 12px rgba(255,255,255,0.8);
      clip-path: polygon(50% 0%, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0% 50%, 39% 38%);
      animation: sparkleAnim 1.4s linear infinite;
      pointer-events: none;
    }

    @keyframes sparkleAnim {
      0% { transform: scale(0.2) rotate(0deg); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: scale(1.2) rotate(180deg); opacity: 0; }
    }

    .falling-heart {
      position: absolute;
      top: -20px;
      z-index: 50;
      pointer-events: none;
      animation: fall linear forwards;
      user-select: none;
      filter: drop-shadow(0 8px 10px rgba(255, 100, 140, 0.2));
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 1;
      }
      100% {
        transform: translateY(120vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    .music-info {
      position: absolute;
      bottom: 12px;
      right: 12px;
      font-size: 11px;
      color: rgba(235, 78, 122, 0.5);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    @media (max-width: 460px) {
      .window {
        min-height: 540px;
      }

      #yes-btn {
        left: 20px;
      }

      #no-btn {
        left: 170px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="window">
    <div class="title-bar">
      <div class="brand">
        <span>LOVE</span>
        <span class="mini-heart">♥</span>
      </div>

      <button class="music-toggle" id="music-toggle" title="Toggle Music">🎵</button>

      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="content" id="screen-1">
      <div class="heart-header">♥ ♥ ♥</div>

      <div class="message">
        Happy 1 year, my love<br>
        <strong>Still love me?</strong>
      </div>

      <div class="cat-box">
        <span class="pixel-cat">🐈‍⬛❤️</span>
      </div>

      <div class="btn-container">
        <button class="btn" id="yes-btn">YES</button>
        <button class="btn" id="no-btn">NO</button>
      </div>
    </div>

    <div class="content hidden" id="screen-2">
      <div class="success-block">
        <div class="heart-header">♥ ♥ ♥</div>

        <div class="success-emoji">💖</div>
        <div class="success-title">Yoyyy! I love you ♡</div>
        <div class="success-date">13 May 2023</div>

        <div class="success-message">
          1 year of our relationship, and a lifetime to go. Happy anniversary, my love ♡
        </div>

        <div class="memory-grid">
          <div class="memory-card"><span>💞</span>Us</div>
          <div class="memory-card"><span>🌙</span>Dreams</div>
          <div class="memory-card"><span>✨</span>Forever</div>
        </div>
      </div>

      <div class="music-info" id="music-info">Music: ON</div>
    </div>
  </div>

  <audio id="background-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script>
    const noBtn = document.getElementById('no-btn');
    const yesBtn = document.getElementById('yes-btn');
    const screen1 = document.getElementById('screen-1');
    const screen2 = document.getElementById('screen-2');
    const musicToggle = document.getElementById('music-toggle');
    const backgroundMusic = document.getElementById('background-music');
    const musicInfo = document.getElementById('music-info');

    let isMusicPlaying = false;

    // Music Toggle
    musicToggle.addEventListener('click', () => {
      if (isMusicPlaying) {
        backgroundMusic.pause();
        isMusicPlaying = false;
        musicToggle.textContent = '🔇';
        if (musicInfo) musicInfo.textContent = 'Music: OFF';
      } else {
        backgroundMusic.play().catch(() => {
          console.log('Music autoplay blocked by browser');
        });
        isMusicPlaying = true;
        musicToggle.textContent = '🎵';
        if (musicInfo) musicInfo.textContent = 'Music: ON';
      }
    });

    // Auto-play music on success screen
    yesBtn.addEventListener('click', () => {
      setTimeout(() => {
        if (!isMusicPlaying) {
          backgroundMusic.play().catch(() => {
            console.log('Music autoplay blocked');
          });
          isMusicPlaying = true;
          musicToggle.textContent = '🎵';
          if (musicInfo) musicInfo.textContent = 'Music: ON';
        }
      }, 500);
    });

    function moveNoButton() {
      const maxX = 95;
      const minX = -90;
      const maxY = 30;
      const minY = -60;

      const randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
      const randomY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('mouseenter', moveNoButton);
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    yesBtn.addEventListener('click', () => {
      screen1.classList.add('hidden');
      screen2.classList.remove('hidden');
      startHeartRain();
      createSparkles();
    });

    function createBackgroundHearts() {
      for (let i = 0; i < 18; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.classList.add('heart-float');
          heart.textContent = ['♥', '❤', '💗', '💖'][Math.floor(Math.random() * 4)];
          heart.style.left = `${Math.random() * 100}%`;
          heart.style.fontSize = `${Math.random() * 22 + 14}px`;
          heart.style.animationDuration = `${Math.random() * 3 + 5}s`;
          heart.style.opacity = `${Math.random() * 0.7 + 0.2}`;
          document.body.appendChild(heart);
        }, i * 180);
      }
    }

    function createSparkles() {
      for (let i = 0; i < 30; i++) {
        const sparkle = document.createElement('div');
        sparkle.classList.add('sparkle');
        sparkle.style.left = `${Math.random() * 100}%`;
        sparkle.style.top = `${Math.random() * 100}%`;
        sparkle.style.animationDelay = `${Math.random() * 1.2}s`;
        sparkle.style.animationDuration = `${Math.random() * 1.3 + 0.8}s`;
        document.body.appendChild(sparkle);

        setTimeout(() => sparkle.remove(), 2200);
      }
    }

    function startHeartRain() {
      const hearts = ['♥', '💖', '💝', '💕', '💗'];
      const heartInterval = setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('falling-heart');
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.fontSize = `${Math.random() * 18 + 18}px`;
        heart.style.animationDuration = `${Math.random() * 2 + 2.5}s`;
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 4000);
      }, 110);

      // Stop after 8 seconds
      setTimeout(() => clearInterval(heartInterval), 8000);
    }

    createBackgroundHearts();
  </script>
</body>
</html>
